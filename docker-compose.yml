services:
  cms:
    build: .
    ports:
      - "4321:4321"
    volumes:
      - cms-data:/app/data
      - cms-uploads:/app/uploads
    environment:
      - PORT=4321
      - DATABASE_URL=/app/data/production.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:4321}
    restart: unless-stopped

volumes:
  cms-data:
  cms-uploads:
